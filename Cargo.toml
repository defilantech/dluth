[workspace]
resolver = "2"
members = [
    "crates/dluth-core",
    "crates/dluth-kernels",
    "crates/dluth-model",
    "crates/dluth-serve",
    "crates/dluth",
    "crates/dluth-cuda",
]
# Plain `cargo build` and `cargo test` use these. A crate that needs a vendor
# toolchain (dluth-cuda needs the CUDA toolkit) is in `members` only and is built
# with `-p <crate>`.
default-members = ["crates/dluth-core", "crates/dluth-kernels", "crates/dluth-model", "crates/dluth-serve", "crates/dluth"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/defilantech/dluth"
homepage = "https://dluth.dev"
description = "Dlúth: a lean, from-scratch LLM inference engine"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
