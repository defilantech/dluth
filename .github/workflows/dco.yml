name: dco
# Every commit in a pull request must carry a Signed-off-by line (the Developer Certificate
# of Origin, https://developercertificate.org).
on:
  pull_request:
    branches: [main]
  # A required check has to report in the merge queue too. The commits were checked on the
  # pull request and the queue's squash commit is GitHub's own, so there is nothing to check.
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  dco:
    name: Developer Certificate of Origin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every commit is signed off
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            if git log -1 --format=%B "${sha}" | grep -q '^Signed-off-by: .* <.*@.*>'; then
              echo "signed off: $(git log -1 --format='%h %s' "${sha}")"
            else
              echo "::error::no Signed-off-by line: $(git log -1 --format='%h %s' "${sha}")"
              missing=1
            fi
          done
          if [ "${missing}" = 1 ]; then
            echo "Sign off with: git commit -s (or git rebase --signoff for commits already made)"
            exit 1
          fi
