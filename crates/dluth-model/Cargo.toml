[package]
name = "dluth-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[lints]
workspace = true

[dependencies]
# The shared element types (DType) that tensor headers are decoded into.
dluth-core = { version = "0.0.0", path = "../dluth-core" }
# Regular expressions with lookahead, which the pre-tokenizer pattern in Qwen tokenizer files uses.
fancy-regex = "0.20.2"
# Maps weight files into memory so a 16 GB model is paged in on demand instead of read up front.
memmap2 = "0.9.12"
# Typed decoding of JSON (safetensors headers, model config, tokenizer files).
serde = { version = "1.0.229", features = ["derive"] }
# The JSON parser behind serde; every model file the engine reads has a JSON part.
serde_json = "1.0.154"
# Unicode NFC composition, the normalization step Qwen tokenizer files ask for.
unicode-normalization = "0.1.26"
